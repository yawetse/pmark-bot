services:
  backend:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: local
      LIVE_ENABLED: "false"
      DEFAULT_SELECTED_VENUE: polymarket_us
      POLYMARKET_US_ENABLED: "false"
      POLYMARKET_INTERNATIONAL_ENABLED: "false"
      ALPACA_ENABLED: "false"
    command:
      - python
      - -c
      - "from app.bootstrap import safe_defaults; assert safe_defaults().global_execution_mode == 'dry_run'; print('backend safe defaults ok')"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    command:
      - node
      - -e
      - "console.log('frontend placeholder ok')"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: codex_poly_bot
      POSTGRES_USER: codex_poly_bot
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex_poly_bot -d codex_poly_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
