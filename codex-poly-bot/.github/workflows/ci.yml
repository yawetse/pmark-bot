# REQ: REQ-DEP-003, REQ-DEP-004, REQ-DEP-005, REQ-DEP-006,
# REQ-DEP-010, REQ-OBS-002
name: Codex Poly Bot CI

on:
  pull_request:
    paths:
      - "codex-poly-bot/**"
      - ".github/workflows/codex-poly-bot-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "codex-poly-bot/**"
      - ".github/workflows/codex-poly-bot-ci.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  select-environment:
    name: Select deploy environment
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.env.outputs.deploy_env }}
    steps:
      - name: Select environment
        id: env
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "deploy_env=production" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            echo "deploy_env=development" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_env=none" >> "$GITHUB_OUTPUT"
          fi

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e codex-poly-bot/backend
      - name: Run backend tests
        run: python -m pytest codex-poly-bot/backend/tests

  frontend-check:
    name: Frontend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codex-poly-bot/frontend/package-lock.json
      - name: Install frontend
        working-directory: codex-poly-bot/frontend
        run: npm ci
      - name: Run frontend checks
        working-directory: codex-poly-bot/frontend
        run: |
          npm run typecheck
          npm run test:auth-boundary
          npm run test:dashboard-controls
          npm run test:dashboard-operations

  migration-safety:
    name: Migration safety
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-check
    steps:
      - uses: actions/checkout@v7
      - name: Reject destructive migrations
        run: |
          python - <<'PY'
          from pathlib import Path

          markers = (
              "drop table",
              "drop column",
              "alter column",
              "drop constraint",
              "truncate table",
          )
          migration_paths = list(Path("codex-poly-bot").glob("**/migrations/**/*.sql"))
          for path in migration_paths:
              text = " ".join(path.read_text().lower().split())
              matches = [marker for marker in markers if marker in text]
              if matches:
                  raise SystemExit(
                      f"{path} requires expand/contract split: {', '.join(matches)}"
                  )
          PY

  infrastructure-deploy:
    name: Infrastructure deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs:
      - select-environment
      - backend-tests
      - frontend-check
      - migration-safety
    environment: ${{ needs.select-environment.outputs.deploy_env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy CloudFormation stack
        env:
          APPLICATION_DOMAIN_NAME: ${{ vars.APPLICATION_DOMAIN_NAME }}
          ALPACA_ACCOUNT_STATUS: ${{ vars.ALPACA_ACCOUNT_STATUS }}
          ALPACA_SYMBOL_PRESETS: ${{ vars.ALPACA_SYMBOL_PRESETS }}
          ALPACA_CUSTOM_SYMBOLS: ${{ vars.ALPACA_CUSTOM_SYMBOLS }}
          ALPACA_SYMBOL_UNIVERSE: ${{ vars.ALPACA_SYMBOL_UNIVERSE }}
          ALPACA_SYMBOL_CHUNK_SIZE: ${{ vars.ALPACA_SYMBOL_CHUNK_SIZE }}
          ALPACA_HISTORICAL_BAR_LIMIT: ${{ vars.ALPACA_HISTORICAL_BAR_LIMIT }}
          BACKEND_TOKEN_SIGNING_SECRET: ${{ secrets.BACKEND_TOKEN_SIGNING_SECRET }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
          DASHBOARD_ALLOWED_USERS: ${{ vars.DASHBOARD_ALLOWED_USERS }}
          DASHBOARD_CSRF_TOKEN: ${{ secrets.DASHBOARD_CSRF_TOKEN }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_USERNAME: ${{ vars.DATABASE_USERNAME }}
          DESIRED_COUNT: ${{ vars.DESIRED_COUNT }}
          DASHBOARD_GITHUB_CLIENT_ID: ${{ vars.DASHBOARD_GITHUB_CLIENT_ID }}
          DASHBOARD_GITHUB_CLIENT_SECRET: ${{ secrets.DASHBOARD_GITHUB_CLIENT_SECRET }}
          PRIVATE_SUBNET_IDS: ${{ vars.PRIVATE_SUBNET_IDS }}
          PUBLIC_SUBNET_IDS: ${{ vars.PUBLIC_SUBNET_IDS }}
          RUNTIME_CONFIG_USERNAME: ${{ vars.RUNTIME_CONFIG_USERNAME }}
          ENABLE_BACKGROUND_WORKER: ${{ vars.ENABLE_BACKGROUND_WORKER }}
          WORKER_HEARTBEAT_INTERVAL_SECONDS: ${{ vars.WORKER_HEARTBEAT_INTERVAL_SECONDS }}
          SES_IDENTITY_EMAIL: ${{ vars.SES_IDENTITY_EMAIL }}
          SIGNOZ_ENABLED: ${{ vars.SIGNOZ_ENABLED }}
          SIGNOZ_FRONTEND_ENABLED: ${{ vars.SIGNOZ_FRONTEND_ENABLED }}
          SIGNOZ_REGION: ${{ vars.SIGNOZ_REGION }}
          SIGNOZ_OTLP_ENDPOINT: ${{ vars.SIGNOZ_OTLP_ENDPOINT }}
          SIGNOZ_INGESTION_KEY_SECRET_ARN: ${{ vars.SIGNOZ_INGESTION_KEY_SECRET_ARN }}
          SIGNOZ_CLOUDWATCH_READ_POLICY_ENABLED: ${{ vars.SIGNOZ_CLOUDWATCH_READ_POLICY_ENABLED }}
          VPC_ID: ${{ vars.VPC_ID }}
        run: ./codex-poly-bot/scripts/deploy-stack.sh "${{ needs.select-environment.outputs.deploy_env }}"

  container-build:
    name: Container build and ECR publish
    runs-on: ubuntu-latest
    needs:
      - select-environment
      - backend-tests
      - frontend-check
      - migration-safety
      - infrastructure-deploy
    if: |
      always() &&
      needs.backend-tests.result == 'success' &&
      needs.frontend-check.result == 'success' &&
      needs.migration-safety.result == 'success' &&
      (needs.infrastructure-deploy.result == 'success' || needs.infrastructure-deploy.result == 'skipped')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t codex-poly-bot-backend -f codex-poly-bot/backend/Dockerfile codex-poly-bot/backend
      - name: Build frontend image
        run: docker build -t codex-poly-bot-frontend -f codex-poly-bot/frontend/Dockerfile codex-poly-bot/frontend
      - name: Configure AWS credentials
        if: needs.select-environment.outputs.deploy_env != 'none' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        if: needs.select-environment.outputs.deploy_env != 'none' && github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push images to ECR
        if: needs.select-environment.outputs.deploy_env != 'none' && github.event_name == 'push'
        env:
          DEPLOY_ENV: ${{ needs.select-environment.outputs.deploy_env }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag codex-poly-bot-backend "$ECR_REGISTRY/codex-poly-bot-$DEPLOY_ENV-backend:${GITHUB_SHA}"
          docker tag codex-poly-bot-frontend "$ECR_REGISTRY/codex-poly-bot-$DEPLOY_ENV-frontend:${GITHUB_SHA}"
          docker tag codex-poly-bot-backend "$ECR_REGISTRY/codex-poly-bot-$DEPLOY_ENV-backend:latest"
          docker tag codex-poly-bot-frontend "$ECR_REGISTRY/codex-poly-bot-$DEPLOY_ENV-frontend:latest"
          docker push "$ECR_REGISTRY/codex-poly-bot-$DEPLOY_ENV-backend:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/codex-poly-bot-$DEPLOY_ENV-frontend:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/codex-poly-bot-$DEPLOY_ENV-backend:latest"
          docker push "$ECR_REGISTRY/codex-poly-bot-$DEPLOY_ENV-frontend:latest"

  deploy-development:
    name: Deploy development
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - backend-tests
      - frontend-check
      - migration-safety
      - infrastructure-deploy
      - container-build
    environment: development
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy ECS service
        run: |
          aws ecs update-service \
            --cluster codex-poly-bot-development-cluster \
            --service codex-poly-bot-development-backend \
            --force-new-deployment
          aws ecs update-service \
            --cluster codex-poly-bot-development-cluster \
            --service codex-poly-bot-development-frontend \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster codex-poly-bot-development-cluster \
            --services codex-poly-bot-development-backend codex-poly-bot-development-frontend

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-tests
      - frontend-check
      - migration-safety
      - infrastructure-deploy
      - container-build
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy ECS service
        run: |
          aws ecs update-service \
            --cluster codex-poly-bot-production-cluster \
            --service codex-poly-bot-production-backend \
            --force-new-deployment
          aws ecs update-service \
            --cluster codex-poly-bot-production-cluster \
            --service codex-poly-bot-production-frontend \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster codex-poly-bot-production-cluster \
            --services codex-poly-bot-production-backend codex-poly-bot-production-frontend
