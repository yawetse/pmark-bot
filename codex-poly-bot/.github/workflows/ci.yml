name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e codex-poly-bot/backend
      - name: Run backend tests
        run: python -m pytest codex-poly-bot/backend/tests

  frontend-check:
    name: Frontend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: codex-poly-bot/frontend/package-lock.json
      - name: Install frontend
        working-directory: codex-poly-bot/frontend
        run: npm ci
      - name: Run frontend checks
        working-directory: codex-poly-bot/frontend
        run: |
          npm run typecheck
          npm run test:auth-boundary
          npm run test:dashboard-controls
          npm run test:dashboard-operations

  container-build:
    name: Container build gate
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-check
    steps:
      - uses: actions/checkout@v4
      - name: Build gate placeholder
        run: echo "Container build waits for tests."
