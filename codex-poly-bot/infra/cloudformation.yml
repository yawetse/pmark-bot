              - !Ref AWS::NoValue
            - !If
              - UsePolymarketClaudeKeyIdSecret
              - Name: POLYMARKET_CLAUDE_KEY_ID
                ValueFrom: !Ref PolymarketClaudeKeyIdSecretArn
              - !Ref AWS::NoValue
            - !If
              - UsePolymarketClaudeSecretKeySecret
              - Name: POLYMARKET_CLAUDE_SECRET_KEY
