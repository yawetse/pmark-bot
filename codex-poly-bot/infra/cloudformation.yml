# REQ: REQ-DEP-002, REQ-DEP-006, REQ-DEP-010, REQ-DEP-011, REQ-WAL-003,
# REQ-DAT-003, REQ-DAT-006, REQ-DAT-007, REQ-NOT-001,
# REQ-OBS-002, REQ-UI-001, REQ-UI-002, REQ-UI-003, REQ-UI-006
AWSTemplateFormatVersion: "2010-09-09"
Description: codex-poly-bot AWS deployment contract
Metadata:
  DeploymentRegion: us-east-1

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - development
      - production
  ProjectName:
    Type: String
    Default: codex-poly-bot
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
  LiveEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  TradingAccountMode:
    Type: String
    Default: paper
    AllowedValues:
      - local
      - paper
      - live
  DefaultSelectedVenue:
    Type: String
    Default: polymarket_us
    AllowedValues:
      - polymarket_us
      - polymarket_international
      - alpaca
  PolymarketUsEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  PolymarketInternationalEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  AlpacaEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  PolymarketMarketOrderSlippage:
    Type: String
    Default: "0.02"
  AlpacaMarketOrderSlippage:
    Type: String
    Default: "0.005"
  AlpacaBaseUrl:
    Type: String
    Default: "https://paper-api.alpaca.markets"
  AlpacaDataFeed:
    Type: String
    Default: iex
  AlpacaAccountStatus:
    Type: String
    Default: active
    AllowedValues:
      - active
      - paper_ready
      - reviewing
      - pending
      - disabled
  AlpacaSymbolPresets:
    Type: String
    Default: "sp500,nasdaq100"
  AlpacaCustomSymbols:
    Type: String
    Default: ""
  AlpacaSymbolUniverse:
    Type: String
    Default: ""
  AlpacaSymbolChunkSize:
    Type: String
    Default: "50"
  AlpacaHistoricalBarLimit:
    Type: String
    Default: "30"
  PolygonRpcUrl:
    Type: String
    Default: ""
  PolygonOrderFilledMaxBlockRange:
    Type: String
    Default: "500"
  PolygonOrderFilledMaxWindows:
    Type: String
    Default: "1"
  PolygonOrderFilledImportCadenceMinutes:
    Type: String
    Default: "60"
  PolygonOrderFilledRetrySplit:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
  SesIdentityEmail:
    Type: String
  NotificationRecipients:
    Type: String
    Default: ""
  EnableBackgroundWorker:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
  WorkerHeartbeatIntervalSeconds:
    Type: Number
    Default: 900
    MinValue: 15
  ManageSesIdentity:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  ApplicationDomainName:
    Type: String
    Default: ""
    Description: Optional HTTPS hostname, for example codex-poly-bot.asyncdoc.net.
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate ARN in us-east-1 for ApplicationDomainName.
  DatabaseUsername:
    Type: String
    Default: codexbot
  DatabasePassword:
    Type: String
    NoEcho: true
  DashboardAllowedUsers:
    Type: String
    Default: yawetse
  RuntimeConfigUsername:
    Type: String
    Default: ""
    Description: Optional dashboard username whose saved config drives scheduled runtime loops. Defaults to the only allowed user when one user is configured.
  BackendTokenSigningSecret:
    Type: String
    NoEcho: true
  DashboardSessionSecret:
    Type: String
    NoEcho: true
  DashboardCsrfToken:
    Type: String
    NoEcho: true
  GithubClientId:
    Type: String
    Default: ""
  GithubClientSecret:
    Type: String
    Default: ""
    NoEcho: true
  PolymarketKeyIdSecretArn:
    Type: String
    Default: ""
  PolymarketSecretKeySecretArn:
    Type: String
    Default: ""
  PolymarketPrivateKeySecretArn:
    Type: String
    Default: ""
  PolymarketOpenAiKeyIdSecretArn:
    Type: String
    Default: ""
  PolymarketOpenAiSecretKeySecretArn:
    Type: String
    Default: ""
  PolymarketOpenAiPrivateKeySecretArn:
    Type: String
    Default: ""
  PolymarketClaudeKeyIdSecretArn:
    Type: String
    Default: ""
  PolymarketClaudeSecretKeySecretArn:
    Type: String
    Default: ""
  PolymarketClaudePrivateKeySecretArn:
    Type: String
    Default: ""
  AlpacaKeyIdSecretArn:
    Type: String
    Default: ""
  AlpacaSecretKeySecretArn:
    Type: String
    Default: ""
  AlpacaOpenAiKeyIdSecretArn:
    Type: String
    Default: ""
  AlpacaOpenAiSecretKeySecretArn:
    Type: String
    Default: ""
  AlpacaClaudeKeyIdSecretArn:
    Type: String
    Default: ""
  AlpacaClaudeSecretKeySecretArn:
    Type: String
    Default: ""
  AlpacaOpenAiBrokerApiKeySecretArn:
    Type: String
    Default: ""
  AlpacaOpenAiBrokerApiSecretSecretArn:
    Type: String
    Default: ""
  AlpacaOpenAiBrokerAccountIdSecretArn:
    Type: String
    Default: ""
  AlpacaOpenAiAchRelationshipIdSecretArn:
    Type: String
    Default: ""
  AlpacaClaudeBrokerApiKeySecretArn:
    Type: String
    Default: ""
  AlpacaClaudeBrokerApiSecretSecretArn:
    Type: String
    Default: ""
  AlpacaClaudeBrokerAccountIdSecretArn:
    Type: String
    Default: ""
  AlpacaClaudeAchRelationshipIdSecretArn:
    Type: String
    Default: ""
  OpenAiAdminApiKeySecretArn:
    Type: String
    Default: ""
  OpenAiTickSummaryTimeoutSeconds:
    Type: Number
    Default: 60
    MinValue: 1
    Description: Read timeout in seconds for OpenAI tick-summary calls before trying fallback models.
  AnthropicAdminApiKeySecretArn:
    Type: String
    Default: ""
  SignozEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable backend OpenTelemetry export to SigNoz.
  SignozFrontendEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable browser telemetry export through the frontend OTLP proxy.
  SignozRegion:
    Type: String
    Default: ""
    Description: SigNoz Cloud region, for example us, eu, or in.
  SignozOtlpEndpoint:
    Type: String
    Default: ""
    Description: Optional custom OTLP base endpoint. Leave empty to derive from SignozRegion.
  SignozIngestionKeySecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN whose value is the raw SigNoz ingestion key.
  SignozCloudWatchReadPolicyEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create an optional managed policy for external SigNoz CloudWatch collectors.

Conditions:
  IsProduction: !Equals [!Ref EnvironmentName, production]
  UseSignoz: !Equals [!Ref SignozEnabled, "true"]
  SignozRegionConfigured: !Not [!Equals [!Ref SignozRegion, ""]]
  SignozEndpointConfigured: !Not [!Equals [!Ref SignozOtlpEndpoint, ""]]
  UseSignozIngestionKeySecret: !Not [!Equals [!Ref SignozIngestionKeySecretArn, ""]]
  CreateSignozCloudWatchReadPolicy: !And
    - !Condition UseSignoz
    - !Equals [!Ref SignozCloudWatchReadPolicyEnabled, "true"]
  CreateSesIdentity: !Equals [!Ref ManageSesIdentity, "true"]
  UseCustomDomain: !Not [!Equals [!Ref ApplicationDomainName, ""]]
  UseHttps: !Not [!Equals [!Ref CertificateArn, ""]]
  UseCustomHttpsDomain: !And
    - !Condition UseCustomDomain
    - !Condition UseHttps
  UsePolymarketKeyIdSecret: !Not [!Equals [!Ref PolymarketKeyIdSecretArn, ""]]
  UsePolymarketSecretKeySecret: !Not [!Equals [!Ref PolymarketSecretKeySecretArn, ""]]
  UsePolymarketPrivateKeySecret: !Not [!Equals [!Ref PolymarketPrivateKeySecretArn, ""]]
  UsePolymarketOpenAiKeyIdSecret: !Not [!Equals [!Ref PolymarketOpenAiKeyIdSecretArn, ""]]
  UsePolymarketOpenAiSecretKeySecret: !Not [!Equals [!Ref PolymarketOpenAiSecretKeySecretArn, ""]]
  UsePolymarketOpenAiPrivateKeySecret: !Not [!Equals [!Ref PolymarketOpenAiPrivateKeySecretArn, ""]]
  UsePolymarketClaudeKeyIdSecret: !Not [!Equals [!Ref PolymarketClaudeKeyIdSecretArn, ""]]
  UsePolymarketClaudeSecretKeySecret: !Not [!Equals [!Ref PolymarketClaudeSecretKeySecretArn, ""]]
  UsePolymarketClaudePrivateKeySecret: !Not [!Equals [!Ref PolymarketClaudePrivateKeySecretArn, ""]]
  UseAlpacaKeyIdSecret: !Not [!Equals [!Ref AlpacaKeyIdSecretArn, ""]]
  UseAlpacaSecretKeySecret: !Not [!Equals [!Ref AlpacaSecretKeySecretArn, ""]]
  UseAlpacaOpenAiKeyIdSecret: !Not [!Equals [!Ref AlpacaOpenAiKeyIdSecretArn, ""]]
  UseAlpacaOpenAiSecretKeySecret: !Not [!Equals [!Ref AlpacaOpenAiSecretKeySecretArn, ""]]
  UseAlpacaClaudeKeyIdSecret: !Not [!Equals [!Ref AlpacaClaudeKeyIdSecretArn, ""]]
  UseAlpacaClaudeSecretKeySecret: !Not [!Equals [!Ref AlpacaClaudeSecretKeySecretArn, ""]]
  UseAlpacaOpenAiBrokerApiKeySecret: !Not [!Equals [!Ref AlpacaOpenAiBrokerApiKeySecretArn, ""]]
  UseAlpacaOpenAiBrokerApiSecretSecret: !Not [!Equals [!Ref AlpacaOpenAiBrokerApiSecretSecretArn, ""]]
  UseAlpacaOpenAiBrokerAccountIdSecret: !Not [!Equals [!Ref AlpacaOpenAiBrokerAccountIdSecretArn, ""]]
  UseAlpacaOpenAiAchRelationshipIdSecret: !Not [!Equals [!Ref AlpacaOpenAiAchRelationshipIdSecretArn, ""]]
  UseAlpacaClaudeBrokerApiKeySecret: !Not [!Equals [!Ref AlpacaClaudeBrokerApiKeySecretArn, ""]]
  UseAlpacaClaudeBrokerApiSecretSecret: !Not [!Equals [!Ref AlpacaClaudeBrokerApiSecretSecretArn, ""]]
  UseAlpacaClaudeBrokerAccountIdSecret: !Not [!Equals [!Ref AlpacaClaudeBrokerAccountIdSecretArn, ""]]
  UseAlpacaClaudeAchRelationshipIdSecret: !Not [!Equals [!Ref AlpacaClaudeAchRelationshipIdSecretArn, ""]]
  UseOpenAiAdminApiKeySecret: !Not [!Equals [!Ref OpenAiAdminApiKeySecretArn, ""]]
  UseAnthropicAdminApiKeySecret: !Not [!Equals [!Ref AnthropicAdminApiKeySecretArn, ""]]

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-${EnvironmentName}-backend"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-${EnvironmentName}-frontend"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  SnapshotBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${EnvironmentName}-snapshots-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: raw-snapshot-retention
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 365
          - Id: normalized-snapshot-retention
            Status: Enabled
            Prefix: normalized/
            ExpirationInDays: 730

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} ${EnvironmentName} database access"
      VpcId: !Ref VpcId

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} ${EnvironmentName} public load balancer"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - !If
          - UseHttps
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: 0.0.0.0/0
          - !Ref AWS::NoValue

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} ${EnvironmentName} ECS service access"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  DatabaseIngressFromService:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ServiceSecurityGroup

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} ${EnvironmentName} postgres subnets"
      SubnetIds: !Ref PrivateSubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-${EnvironmentName}-postgres"
      Engine: postgres
      DBName: codexbot
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      MasterUsername: !Ref DatabaseUsername
      MasterUserPassword: !Ref DatabasePassword
      BackupRetentionPeriod: 7
      DeletionProtection: !If [IsProduction, true, false]

  TradingSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/codex-poly-bot/${EnvironmentName}/trading/runtime"
      Description: !Sub "${ProjectName} ${EnvironmentName} runtime trading credentials"

  WalletSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/codex-poly-bot/${EnvironmentName}/wallets/bootstrap"
      Description: !Sub "${ProjectName} ${EnvironmentName} wallet bootstrap secret"

  OpenAISecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/codex-poly-bot/${EnvironmentName}/openai/api-key"
      Description: !Sub "${ProjectName} ${EnvironmentName} OpenAI API key"
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  AnthropicSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/codex-poly-bot/${EnvironmentName}/anthropic/api-key"
      Description: !Sub "${ProjectName} ${EnvironmentName} Anthropic API key"
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/ecs/${ProjectName}/${EnvironmentName}"
      RetentionInDays: 30

  SesIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: CreateSesIdentity
    DeletionPolicy: Retain
    Properties:
      EmailIdentity: !Ref SesIdentityEmail

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-${EnvironmentName}-cluster"

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets: !Ref PublicSubnetIds
      Type: application

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /
      Matcher:
        HttpCode: "200-399"
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /health
      Matcher:
        HttpCode: "200"
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions: !If
        - UseHttps
        - - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
        - - Type: forward
            TargetGroupArn: !Ref FrontendTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseHttps
    Properties:
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

  FrontendAuthListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/auth/*
      ListenerArn: !If [UseHttps, !Ref HttpsListener, !Ref HttpListener]
      Priority: 5

  FrontendObservabilityListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/observability/*
      ListenerArn: !If [UseHttps, !Ref HttpsListener, !Ref HttpListener]
      Priority: 6

  BackendListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/*
              - /health
      ListenerArn: !If [UseHttps, !Ref HttpsListener, !Ref HttpListener]
      Priority: 10

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-task-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  TaskSecretAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${ProjectName}-${EnvironmentName}-secret-scope"
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/codex-poly-bot/${EnvironmentName}/*"
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - !GetAtt SnapshotBucket.Arn
              - !Sub "${SnapshotBucket.Arn}/*"
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesIdentityEmail}"
          - Effect: Allow
            Action:
              - ce:GetCostAndUsage
            Resource: "*"

  TaskExecutionSecretAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${ProjectName}-${EnvironmentName}-task-execution-secrets"
      Roles:
        - !Ref TaskExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/codex-poly-bot/${EnvironmentName}/*"

  SignozCloudWatchReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: CreateSignozCloudWatchReadPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${EnvironmentName}-signoz-cloudwatch-read"
      Description: !Sub "Read ${ProjectName} ${EnvironmentName} ECS application logs for SigNoz ingestion."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - logs:FilterLogEvents
              - logs:GetLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ecs/${ProjectName}/${EnvironmentName}"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ecs/${ProjectName}/${EnvironmentName}:*"

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${EnvironmentName}-backend"
      Cpu: "2048"
      Memory: "16384"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-${EnvironmentName}-backend:latest"
          Essential: true
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - Name: APP_ENV
              Value: !Ref EnvironmentName
            - Name: ENVIRONMENT
              Value: !Ref EnvironmentName
            - Name: SNAPSHOT_BUCKET
              Value: !Ref SnapshotBucket
            - Name: AWS_COST_EXPLORER_ENABLED
              Value: "true"
            - Name: AWS_COST_EXPLORER_PROJECT_TAG
              Value: Project
            - Name: AWS_COST_EXPLORER_PROJECT_VALUE
              Value: !Ref ProjectName
            - Name: AWS_COST_EXPLORER_ENVIRONMENT_TAG
              Value: Environment
            - Name: AWS_COST_EXPLORER_ACCOUNT_FALLBACK
              Value: "true"
            - Name: HTTP_RESPONSE_LOGS_ENABLED
              Value: "true"
            - Name: OPENAI_TICK_SUMMARY_TIMEOUT_SECONDS
              Value: !Ref OpenAiTickSummaryTimeoutSeconds
            - Name: SIGNOZ_ENABLED
              Value: !Ref SignozEnabled
            - Name: SIGNOZ_REGION
              Value: !Ref SignozRegion
            - Name: SIGNOZ_OTLP_ENDPOINT
              Value: !If
                - SignozEndpointConfigured
                - !Ref SignozOtlpEndpoint
                - !If
                  - SignozRegionConfigured
                  - !Sub "https://ingest.${SignozRegion}.signoz.cloud:443"
                  - ""
            - Name: SIGNOZ_SERVICE_NAME
              Value: !Sub "${ProjectName}-${EnvironmentName}-backend"
            - Name: OTEL_SERVICE_NAME
              Value: !Sub "${ProjectName}-${EnvironmentName}-backend"
            - Name: OTEL_SDK_DISABLED
              Value: "false"
            - Name: DATABASE_URL
              Value: !Sub "postgresql+psycopg://${DatabaseUsername}:${DatabasePassword}@${Database.Endpoint.Address}:5432/codexbot"
            - Name: LIVE_ENABLED
              Value: !Ref LiveEnabled
            - Name: TRADING_ACCOUNT_MODE
              Value: !Ref TradingAccountMode
            - Name: DEFAULT_SELECTED_VENUE
              Value: !Ref DefaultSelectedVenue
            - Name: POLYMARKET_US_ENABLED
              Value: !Ref PolymarketUsEnabled
            - Name: POLYMARKET_INTERNATIONAL_ENABLED
              Value: !Ref PolymarketInternationalEnabled
            - Name: ALPACA_ENABLED
              Value: !Ref AlpacaEnabled
            - Name: POLYMARKET_MARKET_ORDER_SLIPPAGE
              Value: !Ref PolymarketMarketOrderSlippage
            - Name: ALPACA_MARKET_ORDER_SLIPPAGE
              Value: !Ref AlpacaMarketOrderSlippage
            - Name: ALPACA_BASE_URL
              Value: !Ref AlpacaBaseUrl
            - Name: ALPACA_DATA_FEED
              Value: !Ref AlpacaDataFeed
            - Name: ALPACA_ACCOUNT_STATUS
              Value: !Ref AlpacaAccountStatus
            - Name: ALPACA_SYMBOL_PRESETS
              Value: !Ref AlpacaSymbolPresets
            - Name: ALPACA_CUSTOM_SYMBOLS
              Value: !Ref AlpacaCustomSymbols
            - Name: ALPACA_SYMBOL_UNIVERSE
              Value: !Ref AlpacaSymbolUniverse
            - Name: ALPACA_SYMBOL_CHUNK_SIZE
              Value: !Ref AlpacaSymbolChunkSize
            - Name: ALPACA_HISTORICAL_BAR_LIMIT
              Value: !Ref AlpacaHistoricalBarLimit
            - Name: POLYGON_RPC_URL
              Value: !Ref PolygonRpcUrl
