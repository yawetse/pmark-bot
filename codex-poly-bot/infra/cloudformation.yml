            - !If
              - UsePolymarketClaudePrivateKeySecret
              - Name: POLYMARKET_CLAUDE_PRIVATE_KEY
                ValueFrom: !Ref PolymarketClaudePrivateKeySecretArn
              - !Ref AWS::NoValue
            - !If
              - UseAlpacaKeyIdSecret
              - Name: ALPACA_KEY_ID
                ValueFrom: !Ref AlpacaKeyIdSecretArn
              - !Ref AWS::NoValue
            - !If
              - UseAlpacaSecretKeySecret
              - Name: ALPACA_SECRET_KEY
                ValueFrom: !Ref AlpacaSecretKeySecretArn
              - !Ref AWS::NoValue
            - !If
              - UseAlpacaOpenAiKeyIdSecret
              - Name: ALPACA_OPENAI_KEY_ID
                ValueFrom: !Ref AlpacaOpenAiKeyIdSecretArn
              - !Ref AWS::NoValue
            - !If
              - UseAlpacaOpenAiSecretKeySecret
              - Name: ALPACA_OPENAI_SECRET_KEY
                ValueFrom: !Ref AlpacaOpenAiSecretKeySecretArn
              - !Ref AWS::NoValue
            - !If
              - UseAlpacaClaudeKeyIdSecret
