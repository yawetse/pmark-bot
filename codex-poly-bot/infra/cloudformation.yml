          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${EnvironmentName}-frontend"
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: frontend
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-${EnvironmentName}-frontend:latest"
          Essential: true
          PortMappings:
            - ContainerPort: 3000
          Environment:
            - Name: NEXT_PUBLIC_API_BASE_URL
              Value: !If
                - UseCustomHttpsDomain
                - !Sub "https://${ApplicationDomainName}"
                - !Sub "http://${ApplicationLoadBalancer.DNSName}"
            - Name: BACKEND_API_BASE_URL
              Value: !If
                - UseCustomHttpsDomain
                - !Sub "https://${ApplicationDomainName}"
                - !Sub "http://${ApplicationLoadBalancer.DNSName}"
            - Name: NEXT_PUBLIC_APP_ENV
              Value: !Ref EnvironmentName
            - Name: BACKEND_TOKEN_SIGNING_SECRET
              Value: !Ref BackendTokenSigningSecret
            - Name: DASHBOARD_SESSION_SECRET
              Value: !Ref DashboardSessionSecret
            - Name: DASHBOARD_CSRF_TOKEN
              Value: !Ref DashboardCsrfToken
            - Name: DASHBOARD_ALLOWED_USERS
              Value: !Ref DashboardAllowedUsers
            - Name: NEXTAUTH_URL
              Value: !If
                - UseCustomHttpsDomain
                - !Sub "https://${ApplicationDomainName}"
                - !Sub "http://${ApplicationLoadBalancer.DNSName}"
            - Name: GITHUB_CLIENT_ID
              Value: !Ref GithubClientId
            - Name: GITHUB_CLIENT_SECRET
              Value: !Ref GithubClientSecret
            - Name: ALLOW_LOCAL_AUTH_BYPASS
              Value: "false"
            - Name: SIGNOZ_ENABLED
              Value: !Ref SignozEnabled
            - Name: SIGNOZ_FRONTEND_ENABLED
              Value: !Ref SignozFrontendEnabled
            - Name: SIGNOZ_REGION
              Value: !Ref SignozRegion
            - Name: SIGNOZ_OTLP_ENDPOINT
              Value: !If
                - SignozEndpointConfigured
                - !Ref SignozOtlpEndpoint
                - !If
                  - SignozRegionConfigured
                  - !Sub "https://ingest.${SignozRegion}.signoz.cloud:443"
                  - ""
            - Name: SIGNOZ_FRONTEND_SERVICE_NAME
              Value: !Sub "${ProjectName}-${EnvironmentName}-frontend"
            - Name: OTEL_SDK_DISABLED
              Value: "false"
          Secrets:
            - !If
              - UseSignozIngestionKeySecret
              - Name: SIGNOZ_INGESTION_KEY
                ValueFrom: !Ref SignozIngestionKeySecretArn
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  BackendService:
    Type: AWS::ECS::Service
    DependsOn:
      - BackendListenerRule
    Properties:
      ServiceName: !Sub "${ProjectName}-${EnvironmentName}-backend"
      LaunchType: FARGATE
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref BackendTaskDefinition
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8000
          TargetGroupArn: !Ref BackendTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets: !Ref PublicSubnetIds

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn:
      - FrontendAuthListenerRule
      - FrontendObservabilityListenerRule
    Properties:
      ServiceName: !Sub "${ProjectName}-${EnvironmentName}-frontend"
      LaunchType: FARGATE
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref FrontendTaskDefinition
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 3000
          TargetGroupArn: !Ref FrontendTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets: !Ref PublicSubnetIds

Outputs:
  ApplicationUrl:
    Value: !If
      - UseCustomHttpsDomain
      - !Sub "https://${ApplicationDomainName}"
      - !Sub "http://${ApplicationLoadBalancer.DNSName}"
  LoadBalancerDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  ApplicationLogGroupName:
    Value: !Ref ApplicationLogGroup
  SignozCloudWatchReadPolicyArn:
    Condition: CreateSignozCloudWatchReadPolicy
    Value: !Ref SignozCloudWatchReadPolicy
  SignozMcpUrl:
    Value: !If
      - SignozRegionConfigured
      - !Sub "https://mcp.${SignozRegion}.signoz.cloud/mcp"
      - ""
  CustomDomainName:
    Value: !Ref ApplicationDomainName
  CertificateArn:
    Value: !Ref CertificateArn
  BackendRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
  SnapshotBucketName:
    Value: !Ref SnapshotBucket
  ClusterName:
    Value: !Ref Cluster
  BackendServiceName:
    Value: !GetAtt BackendService.Name
  FrontendServiceName:
    Value: !GetAtt FrontendService.Name
