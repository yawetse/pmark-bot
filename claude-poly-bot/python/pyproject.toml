[project]
name = "claude-poly-bot"
version = "0.1.0"
description = "Dual-LLM (Claude + OpenAI) trading bot for Polymarket and Alpaca"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yaw Etse", email = "yaw.etse@gmail.com" }]

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    # Data validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # External SDKs
    "anthropic>=0.40",
    "openai>=1.55",
    "py-clob-client>=0.20",
    "alpaca-py>=0.34",
    # Web3 / EVM
    "eth-account>=0.13",
    "web3>=7.6",
    # AWS
    "boto3>=1.35",
    "aioboto3>=14.0",
    # Auth
    "authlib>=1.3",
    "python-jose[cryptography]>=3.3",
    # Data processing
    "polars>=1.13",
    # Observability
    "structlog>=24.4",
    # HTTP
    "httpx>=0.27",
    # CLI
    "typer>=0.13",
    # Utilities
    "python-dateutil>=2.9",
    "pytz>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.119",
    "testcontainers[postgres]>=4.8",
    "moto[all]>=5.0",
    "respx>=0.21",
    "polyfactory>=2.18",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pytz",
    "types-python-dateutil",
    "import-linter>=2.1",
]

[project.scripts]
claude-poly-bot = "claude_poly_bot.cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_poly_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["claude_poly_bot", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "ASYNC",        # async-specific
    "S",            # bandit security
    "RUF",          # ruff-specific
]
ignore = [
    "S101",  # assert (we use it)
    "S311",  # pseudo-random (not crypto)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "claude_poly_bot"

[[tool.mypy.overrides]]
module = ["py_clob_client.*", "alpaca.*", "moto.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration_live: requires live API access (gated by INTEGRATION_LIVE=1)",
    "slow: slow tests (excluded from default run)",
]
addopts = [
    "--strict-markers",
    "-ra",
]

[tool.coverage.run]
source = ["claude_poly_bot"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
