# @spec OBS-030
name: SigNoz Codex Alert Triage

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number for the SigNoz alert to triage.
        required: true
        type: string
      operation:
        description: Manual action to run for the alert issue.
        required: true
        default: triage
        type: choice
        options:
          - triage
          - close_resolved

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  issue_context:
    name: Load alert issue
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.issue.outputs.issue_number }}
      issue_title: ${{ steps.issue.outputs.issue_title }}
      issue_body: ${{ steps.issue.outputs.issue_body }}
      has_signoz_resolved: ${{ steps.issue.outputs.has_signoz_resolved }}
      operation: ${{ steps.issue.outputs.operation }}
    steps:
      - name: Load issue metadata
        id: issue
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = Number('${{ inputs.issue_number }}');
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('issue_number must be a positive integer.');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const labels = issue.labels
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter(Boolean);

            if (!labels.includes('signoz-alert')) {
              core.setFailed(`Issue #${issueNumber} is not labeled signoz-alert.`);
              return;
            }

            core.setOutput('issue_number', String(issue.number));
            core.setOutput('issue_title', issue.title || '');
            core.setOutput('issue_body', issue.body || '');
            core.setOutput('has_signoz_resolved', String(labels.includes('signoz-resolved')));
            core.setOutput('operation', '${{ inputs.operation }}');

  generate_fix:
    name: Generate Codex triage patch
    needs: issue_context
    if: needs.issue_context.outputs.operation == 'triage'
    runs-on: ubuntu-latest
    concurrency:
      group: signoz-codex-alert-${{ needs.issue_context.outputs.issue_number }}
      cancel-in-progress: false
    outputs:
      has_patch: ${{ steps.diff.outputs.has_patch }}
      has_openai_key: ${{ steps.key.outputs.has_openai_key }}
    steps:
      - name: Check Codex API key
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "has_openai_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_openai_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment when Codex key is missing
        if: steps.key.outputs.has_openai_key != 'true'
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.issue_context.outputs.issue_number }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: [
                'Manual Codex triage did not start because `OPENAI_API_KEY` is not configured for this repository.',
                '',
                'The SigNoz alert issue is still available for manual triage.'
              ].join('\n'),
            });

      - name: Checkout code
        if: steps.key.outputs.has_openai_key == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        if: steps.key.outputs.has_openai_key == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node.js
        if: steps.key.outputs.has_openai_key == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codex-poly-bot/frontend/package-lock.json

      - name: Install safe project dependencies
        if: steps.key.outputs.has_openai_key == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e codex-poly-bot/backend
          npm ci --prefix codex-poly-bot/frontend

      - name: Run Codex
        if: steps.key.outputs.has_openai_key == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          output-file: codex-signoz-output.md
          prompt: |
            A SigNoz alert created GitHub issue #${{ needs.issue_context.outputs.issue_number }} in yawetse/pmark-bot for codex-poly-bot.

            Issue title:
            ${{ needs.issue_context.outputs.issue_title }}

            Issue body:
            ${{ needs.issue_context.outputs.issue_body }}

            Diagnose the likely regression from the alert context and the codex-poly-bot application under `codex-poly-bot/`. Make the smallest safe code or test change only when the cause is clear from repository evidence. Keep live trading disabled and do not add production trading secrets.

            Run focused backend or frontend checks when practical. Do not merge, deploy, modify production settings, rotate secrets, or make unrelated refactors.

      - name: Comment Codex result
        if: steps.key.outputs.has_openai_key == 'true' && always()
        uses: actions/github-script@v9
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
          ISSUE_NUMBER: ${{ needs.issue_context.outputs.issue_number }}
        with:
          script: |
            const body = process.env.CODEX_FINAL_MESSAGE?.trim()
              || 'Codex ran for this SigNoz alert, but did not return a final message.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body,
            });

      - name: Create patch artifact
        if: steps.key.outputs.has_openai_key == 'true'
        id: diff
        run: |
          rm -f codex-signoz.patch
          git add -N .
          git diff --binary HEAD -- . ':(exclude)codex-signoz-output.md' > codex-signoz.patch
          if [ -s codex-signoz.patch ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch artifact
        if: steps.diff.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: signoz-codex-alert-patch
          path: codex-signoz.patch
          if-no-files-found: error

      - name: Close synthetic no-change alert
        if: steps.diff.outputs.has_patch == 'false'
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.issue_context.outputs.issue_number }}
          ISSUE_TITLE: ${{ needs.issue_context.outputs.issue_title }}
          ISSUE_BODY: ${{ needs.issue_context.outputs.issue_body }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const body = `${process.env.ISSUE_TITLE || ''}\n${process.env.ISSUE_BODY || ''}`.toLowerCase();
            const isSynthetic = /\b(synthetic|smoke test|test alert|fake alert)\b/.test(body);
            if (!isSynthetic) {
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                'Disposition: this synthetic SigNoz alert produced no remediation patch and can be closed.',
                '',
                'Closing automatically because the alert is explicitly marked as a test or smoke-test signal.'
              ].join('\n'),
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed',
            });

  close_resolved:
    name: Close resolved alert issue
    needs: issue_context
    if: needs.issue_context.outputs.operation == 'close_resolved' && needs.issue_context.outputs.has_signoz_resolved == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: signoz-resolved-alert-${{ needs.issue_context.outputs.issue_number }}
      cancel-in-progress: false
    steps:
      - name: Close when no remediation PR is open
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.issue_context.outputs.issue_number }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issueRef = `#${issueNumber}`;
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:pr is:open "${issueRef}"`;
            const openPrs = await github.paginate(github.rest.search.issuesAndPullRequests, {
              q,
              per_page: 20,
            });

            if (openPrs.length > 0) {
              const prList = openPrs
                .map((pr) => `- #${pr.number}: ${pr.title}`)
                .join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: [
                  'SigNoz marked this alert resolved, but an open remediation PR still references this issue.',
                  '',
                  prList,
                  '',
                  'Leaving the issue open until that PR is handled.'
                ].join('\n'),
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                'SigNoz marked this alert resolved and no open remediation PR references this issue.',
                '',
                'Closing automatically.'
              ].join('\n'),
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed',
            });

  open_pr:
    name: Open draft pull request
    needs: [issue_context, generate_fix]
    if: needs.generate_fix.outputs.has_openai_key == 'true' && needs.generate_fix.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download patch artifact
        uses: actions/download-artifact@v7
        with:
          name: signoz-codex-alert-patch

      - name: Apply patch
        run: git apply --index codex-signoz.patch

      - name: Open draft PR
        env:
          GH_TOKEN: ${{ secrets.SIGNOZ_CODEX_PR_TOKEN || github.token }}
          ISSUE_NUMBER: ${{ needs.issue_context.outputs.issue_number }}
          ISSUE_TITLE: ${{ needs.issue_context.outputs.issue_title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="codex/signoz-alert-${ISSUE_NUMBER}-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Investigate SigNoz alert #${ISSUE_NUMBER}"
          git push origin "$branch"

          {
            echo "Draft remediation for SigNoz alert issue #${ISSUE_NUMBER}."
            echo
            echo "Source issue: #${ISSUE_NUMBER}"
            echo "Alert title: ${ISSUE_TITLE}"
            echo
            echo "Review the patch and run the normal validation before merging."
          } > pr-body.md

          if pr_url="$(
            gh pr create \
              --draft \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "Investigate SigNoz alert #${ISSUE_NUMBER}" \
              --body-file pr-body.md \
              2>pr-error.log
          )"; then
            gh issue comment "$ISSUE_NUMBER" --body "Codex opened a draft remediation PR: $pr_url"
          else
            if [ -s pr-error.log ]; then
              pr_error="$(tr '\n' ' ' < pr-error.log | cut -c1-600)"
            else
              pr_error="gh pr create failed without stderr output"
            fi
            branch_url="https://github.com/${GITHUB_REPOSITORY}/tree/${branch}"
            {
              echo "Codex pushed a remediation branch but could not open a draft PR."
              echo
              echo "Branch: ${branch_url}"
              echo
              echo "Error: \`${pr_error}\`"
              echo
              echo "Configure \`SIGNOZ_CODEX_PR_TOKEN\` with pull request creation rights, or enable GitHub Actions pull request creation, before re-enabling automatic triage."
            } > pr-fallback-comment.md
            gh issue comment "$ISSUE_NUMBER" --body-file pr-fallback-comment.md
            echo "::warning::Draft PR creation failed: ${pr_error}"
          fi
